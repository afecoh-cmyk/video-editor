{% extends "base.html" %}
{% block title %}VideoEditor Pro - Projektek{% endblock %}

{% block content %}
<div class="projects-page">
    <div class="page-header">
        <h1>Projektek</h1>
        <button class="btn btn-primary" onclick="createProject()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Új projekt
        </button>
    </div>

    <div id="projects-grid" class="projects-grid">
        <div class="loading">Betöltés...</div>
    </div>

    <!-- New Project Modal -->
    <div id="new-project-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div class="modal-content">
            <h2>Új projekt létrehozása</h2>
            <form id="new-project-form" onsubmit="submitNewProject(event)">
                <div class="form-group">
                    <label for="project-name">Projekt neve</label>
                    <input type="text" id="project-name" value="Új videó projekt" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="project-width">Szélesség</label>
                        <select id="project-width">
                            <option value="1920" selected>1920 (Full HD)</option>
                            <option value="3840">3840 (4K)</option>
                            <option value="1280">1280 (HD)</option>
                            <option value="1080">1080 (Vertical)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="project-height">Magasság</label>
                        <select id="project-height">
                            <option value="1080" selected>1080</option>
                            <option value="2160">2160</option>
                            <option value="720">720</option>
                            <option value="1920">1920 (Vertical)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="project-fps">FPS</label>
                        <select id="project-fps">
                            <option value="24" selected>24</option>
                            <option value="25">25</option>
                            <option value="30">30</option>
                            <option value="60">60</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Mégse</button>
                    <button type="submit" class="btn btn-primary">Létrehozás</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
async function loadProjects() {
    const res = await fetch('/api/projects');
    const projects = await res.json();
    const grid = document.getElementById('projects-grid');

    if (projects.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                    <polygon points="23 7 16 12 23 17 23 7"/>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
                <h3>Még nincs projekt</h3>
                <p>Hozz létre egy új projektet a videó szerkesztés megkezdéséhez!</p>
            </div>`;
        return;
    }

    grid.innerHTML = projects.map(p => `
        <div class="project-card" onclick="window.location='/editor/${p.id}'">
            <div class="project-card-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polygon points="23 7 16 12 23 17 23 7"/>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
            </div>
            <div class="project-card-info">
                <h3>${p.name}</h3>
                <span class="project-meta">${p.resolution[0]}x${p.resolution[1]} | ${p.fps} FPS</span>
                <span class="project-meta">${p.segments?.length || 0} szegmens | ${p.assets?.length || 0} fájl</span>
            </div>
            <button class="btn btn-icon btn-danger" onclick="event.stopPropagation(); deleteProject('${p.id}')" title="Törlés">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
            </button>
        </div>
    `).join('');
}

function createProject() {
    document.getElementById('new-project-modal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('new-project-modal').classList.add('hidden');
}

async function submitNewProject(e) {
    e.preventDefault();
    const res = await fetch('/api/projects', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: document.getElementById('project-name').value,
            resolution: [
                parseInt(document.getElementById('project-width').value),
                parseInt(document.getElementById('project-height').value)
            ],
            fps: parseInt(document.getElementById('project-fps').value)
        })
    });
    const project = await res.json();
    window.location = `/editor/${project.id}`;
}

async function deleteProject(id) {
    if (!confirm('Biztosan törölni szeretnéd ezt a projektet?')) return;
    await fetch(`/api/projects/${id}`, {method: 'DELETE'});
    loadProjects();
}

loadProjects();
</script>
{% endblock %}
